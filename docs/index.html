<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Codex Game Studios is a Codex-native framework for game design, implementation, review, QA, playtests, and production planning."
    >
    <meta name="theme-color" content="#dce9ca">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Codex Game Studios">
    <meta
      property="og:description"
      content="A Codex-native game-development framework with six-language documentation."
    >
    <meta
      property="og:image"
      content="https://dustsaint.github.io/codex-game-studios/assets/codex-game-studios-banner-minimal.png"
    >
    <title>Codex Game Studios</title>
    <link rel="stylesheet" href="./assets/styles.css">
    <script type="module" src="./assets/app.mjs"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="./" aria-label="Codex Game Studios home">
          <span class="brand-mark" aria-hidden="true">CGS</span>
          <span>Codex Game Studios</span>
        </a>

        <div class="header-actions">
          <label class="language-select-label" for="language-select">
            <span id="language-label">Language</span>
            <select id="language-select" aria-label="Language">
              <option value="en">English</option>
              <option value="zh-CN">简体中文</option>
              <option value="ru">Русский</option>
              <option value="de">Deutsch</option>
              <option value="ja">日本語</option>
              <option value="ko">한국어</option>
            </select>
          </label>
          <a
            class="github-link"
            href="https://github.com/DustSaint/codex-game-studios"
            rel="noreferrer"
          >
            <span id="github-label">View on GitHub</span>
            <span aria-hidden="true">↗</span>
          </a>
        </div>
      </div>

      <nav class="language-links" aria-label="Languages">
        <a data-locale-link="en" href="./?lang=en">English</a>
        <a data-locale-link="zh-CN" href="./?lang=zh-CN">简体中文</a>
        <a data-locale-link="ru" href="./?lang=ru">Русский</a>
        <a data-locale-link="de" href="./?lang=de">Deutsch</a>
        <a data-locale-link="ja" href="./?lang=ja">日本語</a>
        <a data-locale-link="ko" href="./?lang=ko">한국어</a>
      </nav>
    </header>

    <main id="main-content" class="site-main">
      <div class="loading-card" role="status">Loading Codex Game Studios…</div>
    </main>

    <noscript>
      <section class="noscript-card">
        <h1>Codex Game Studios</h1>
        <p>This multilingual page requires JavaScript to switch languages.</p>
        <p>
          <a href="https://github.com/DustSaint/codex-game-studios">Open the GitHub repository</a>
        </p>
      </section>
    </noscript>
  </body>
</html>
